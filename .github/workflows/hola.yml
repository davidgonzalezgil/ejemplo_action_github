name: mi primera action

on: push

jobs: 
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio de codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ejecutar hola.js
        run: node hola.js